[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
build_src_filter = +<*> -<digital_main.cpp>
lib_deps =
  256dpi/MQTT@^2.5.2
  bblanchon/ArduinoJson@^7

; Bench only, with no hub: adds the serial `demo` command. Never flash this for the
; demo with the hub (a locally made version breaks S5 in the portal).
[env:esp32dev_offline]
extends = env:esp32dev
build_flags = -Wall -DLOCAL_DEMO

; Hub bench without a router. Private AP credentials live only in secrets.h.
[env:esp32dev_ap]
extends = env:esp32dev
build_flags = -Wall -DBENCH_AP

; Device-only WiFi interruption for S6 bench evidence; restore esp32dev afterward.
[env:esp32dev_network_test]
extends = env:esp32dev
build_flags = -Wall -DNETWORK_BENCH

[env:native]
platform = native
build_flags = -std=c++11 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE
build_src_filter = +<prescription.cpp> +<pump_controller.cpp> +<digital_main.cpp>
lib_deps = bblanchon/ArduinoJson@^7
test_build_src = yes
test_framework = unity
