<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinician portal (prototype)</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="clinician.css">
  <script>
    try { if (localStorage.getItem("sp-theme") === "night") document.documentElement.dataset.theme = "night"; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip_to_content">Skip to main content</a>

  <header class="topbar">
    <div>
      <h1 data-i18n="clin_title">Clinician portal</h1>
      <p class="who" data-i18n="clin_user">Signed in as Dr. Demo (demo user, no real login)</p>
    </div>
    <div class="topbar-right">
      <span id="sim-slot"></span>
      <button id="night-toggle" class="btn btn-small" type="button" aria-pressed="false"></button>
    </div>
  </header>

  <main id="main" class="wide" tabindex="-1">
    <p id="conn" class="banner conn"></p>
    <div id="conn-live" class="visually-hidden" role="status" aria-atomic="true"></div>

    <div class="columns">
      <div>
        <section class="card" aria-labelledby="live-title">
          <h2 id="live-title"><span data-i18n="clin_live">Pump now</span> <span id="pump-name" class="muted"></span></h2>
          <dl class="facts">
            <div><dt data-i18n="clin_state">State</dt><dd id="live-state"></dd></div>
            <div><dt data-i18n="family_rate_now">Rate now</dt><dd id="live-rate"></dd></div>
            <div><dt data-i18n="clin_active_version">Active version</dt><dd id="live-version"></dd></div>
            <div><dt data-i18n="family_delivered">Delivered</dt><dd id="live-delivered"></dd></div>
          </dl>
        </section>

        <section class="card" aria-labelledby="propose-title">
          <h2 id="propose-title" data-i18n="clin_propose_title">Propose a change</h2>
          <p class="hint" data-i18n="clin_propose_intro"></p>

          <div id="form-errors" class="banner tone-danger" role="alert" tabindex="-1" hidden></div>

          <form id="propose-form" novalidate>
            <fieldset>
              <legend data-i18n="field_mode">Mode</legend>
              <div class="radio-row">
                <label><input type="radio" name="mode" value="continuous" checked> <span data-i18n="mode_continuous">Continuous</span></label>
                <label><input type="radio" name="mode" value="bolus"> <span data-i18n="mode_bolus">Bolus</span></label>
              </div>
            </fieldset>

            <div class="field">
              <label for="rate" data-i18n="field_rate">Rate</label>
              <input id="rate" name="rate_ml_hr" type="number" inputmode="decimal" step="any"
                     aria-describedby="rate-hint rate-error">
              <p id="rate-hint" class="hint" data-i18n="clin_rate_hint"></p>
              <p id="rate-error" class="field-error" hidden></p>
            </div>

            <div class="field">
              <label for="volume" data-i18n="field_volume">Feed volume</label>
              <input id="volume" name="volume_ml" type="number" inputmode="decimal" step="any"
                     aria-describedby="volume-hint volume-error">
              <p id="volume-hint" class="hint" data-i18n="clin_volume_hint"></p>
              <p id="volume-error" class="field-error" hidden></p>
            </div>

            <div class="field">
              <label for="note" data-i18n="field_note">Note</label>
              <textarea id="note" name="note" aria-describedby="note-hint note-error"></textarea>
              <p id="note-hint" class="hint"></p>
              <p id="note-error" class="field-error" hidden></p>
            </div>

            <button id="propose-btn" class="btn btn-primary" type="submit"></button>
            <p id="propose-result" class="notice" role="status" hidden></p>
          </form>
        </section>
      </div>

      <section class="card" aria-labelledby="history-title">
        <h2 id="history-title" data-i18n="clin_history_title">Prescriptions</h2>
        <ol id="history" class="history"></ol>
        <!-- Announces chip changes as the hub reports them. -->
        <div id="chip-live" class="visually-hidden" role="status" aria-atomic="true"></div>
      </section>
    </div>
  </main>

  <footer id="footer" class="site-footer"></footer>

  <script type="module" src="clinician.js"></script>
</body>
</html>
