# Mosquitto config for the demo network.
#
# Anonymous access is a prototype shortcut for a private, offline network.
# It is listed as a known gap in docs/SAFETY.md. Do not expose this broker
# to a shared or public network.
listener 1883
allow_anonymous true
# Retained messages (the latest prescription) survive a broker restart only
# with persistence on (PRD R3). The path is relative to where mosquitto is
# started, so always use `make broker` from the repo root.
persistence true
persistence_location .mosquitto/
