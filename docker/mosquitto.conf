# Mosquitto inside Docker (compose service "broker"). Same rules as
# scripts/mosquitto.conf: anonymous access is a prototype shortcut for a private,
# offline demo network, listed as a known gap in docs/SAFETY.md.
listener 1883
allow_anonymous true

# Retained prescriptions survive a broker restart (PRD R3). /mosquitto/data is a
# named volume in compose.yaml.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
